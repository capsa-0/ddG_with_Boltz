[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddg_predictor"
version = "0.1.0"
description = "DDG predictor that uses Boltz embeddings."
authors = [ { name = "Tu Nombre", email = "tu@email.com" } ]
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }
readme = "README.md"

dependencies = [
    "torch>=2.2",
    "numpy>=1.26,<2.0",
    "pandas>=2.2.2",
    "biopython==1.84",
    "pyyaml==6.0.2",
    "scikit-learn==1.6.1",
    "openpyxl",
    "tqdm",
    "matplotlib",
    "seaborn",
    "hydra-core==1.3.2",
    "pytorch-lightning==2.5.0",
    "rdkit>=2024.3.2",
    "dm-tree==0.1.8",
    "requests==2.32.3",
    "types-requests",
    "einops==0.8.0",
    "einx==0.3.0",
    "fairscale==0.4.13",
    "mashumaro==3.14",
    "modelcif==1.2",
    "wandb==0.18.7",
    "click==8.1.7",
    "scipy==1.13.1",
    "numba==0.61.0",
    "gemmi==0.6.5",
    "chembl_structure_pipeline==1.2.2",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
cuda = [
    "cuequivariance_ops_cu12>=0.5.0",
    "cuequivariance_ops_torch_cu12>=0.5.0",
    "cuequivariance_torch>=0.5.0",
]

[project.scripts]
boltz = "boltz.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
lint.select = ["ALL"]
lint.ignore = [ "COM812", "ISC001", "ANN101", "RET504", "S101", "D100", "D104", "PT001", "PT004", "PT005", "PT023", "FBT001", "FBT002", "PLR0913" ]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]

[tool.pytest.ini_options]
markers = [ "slow: marks tests as slow (deselect with '-m \"not slow\"')", "regression" ]
