[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ddg-with-boltz"
version = "0.1.0"
description = "Predict ddG of point mutations from Boltz-2 trunk embeddings"
requires-python = ">=3.10"
# Scientific/runtime dependencies are managed by environment.yml (conda + the
# editable Boltz fork). Kept empty here so `pip install -e .` does not try to
# resolve/replace the conda-managed stack.
dependencies = []

[project.scripts]
ddg = "ddg.cli:main"

[tool.setuptools.packages.find]
include = ["ddg*"]

# Note: the CLI resolves some paths relative to the project root
# (e.g. the default --names-config 'ddg/config/internal_config.yaml' and the
# 'external' MMseqs helper), so run `ddg` from the repository root.
