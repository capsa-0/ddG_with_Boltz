# Full single-point-mutation scan of GLA_human (398 aa).
# 7562 mutants + 1 wild-type = 7563 Boltz structures.
# Mutation strings in the CSV are 1-based over the sequence; results
# are reported with the first residue numbered 32.
# Generated by `python -m ddg.scan build` — see ddg/scan/build.py.
scan:
  first_residue: 32
head:
  mode: inference
  experiment_name: scan_GLA_human
data_processing:
  overwrite: false
  raw_data_path: data/raw/scan_GLA_human.csv
  dataset_type: minimal
  msa_strategy: mutate_wt_msa
  msa_mutation_strategy: mutate_first_row
  max_msa_sequences: 1000
feature_extraction:
  process_one_by_one: false
  boltz_flags:
    accelerator: gpu
    model: boltz2
    recycling_steps: 3
    write_full_pae: false
    write_full_pde: false
    write_embeddings: true
    skip_run_structure: true
    no_kernels: true
slim:
  keep_s: false
  delete_raw: true
feature:
  source: auto
  blocks:
  - zdiag
  - zpool
  - wtz
  - mtz
