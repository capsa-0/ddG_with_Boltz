  - 261
  - 271
  - 274
  - 301
  - 325
  - 328
  - 334
  - 346
  - 360
  - 361
  - 373
  - 375
  - 395
  - 409
  - 411
head:
  mode: inference
  experiment_name: scan_GLA_human_hard
data_processing:
  overwrite: false
  raw_data_path: data/raw/scan_GLA_human_hard.csv
  dataset_type: minimal
  msa_strategy: mutate_wt_msa
  msa_mutation_strategy: mutate_first_row
  max_msa_sequences: 1000
feature_extraction:
  process_one_by_one: false
  boltz_flags:
    accelerator: gpu
    model: boltz2
    recycling_steps: 3
    write_full_pae: false
    write_full_pde: false
    write_embeddings: true
    skip_run_structure: true
    no_kernels: true
slim:
  keep_s: false
  delete_raw: true
feature:
  source: auto
  blocks:
  - zdiag
  - zpool
  - wtz
  - mtz
