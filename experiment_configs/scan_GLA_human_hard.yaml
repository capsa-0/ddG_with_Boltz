# PARTIAL single-point-mutation scan (38 of 398 positions) of GLA_human (398 aa).
# 722 mutants + 1 wild-type = 723 Boltz structures.
# Mutation strings in the CSV are 1-based over the sequence; results
# are reported with the first residue numbered 32.
# Generated by `python -m ddg.scan build` — see ddg/scan/build.py.
scan:
  first_residue: 32
  n_positions: 38
  positions:
  - 35
  - 43
  - 80
  - 85
  - 104
  - 116
  - 128
  - 132
  - 137
  - 138
  - 144
  - 147
  - 150
