head:
  mode: "train"
  experiment_name: "fireprot_le200"
data_processing:
  overwrite: false
  raw_data_path: "data/raw/fireprot_le200.csv"
  dataset_type: "fireprot"
  msa_strategy: "mutate_wt_msa"
  msa_mutation_strategy: "mutate_first_row"
  max_msa_sequences: 1000
feature_extraction:
  process_one_by_one: false
  boltz_flags:
    accelerator: "gpu"
    model: "boltz2"
    recycling_steps: 3
    write_full_pae: false
    write_full_pde: false
    write_embeddings: true
    skip_run_structure: true
slim:
  keep_s: false
  delete_raw: true
feature:
  source: "auto"
training:
  target: "ddg"
  test_size: 0.2
  random_state: 42
