# Benchmark corpus — FAST arm.
# All 412 Tsuboyama proteins, ~30 mutations/protein subsampled stratified by
# substitution (built by ddg_datasets/build_benchmark_corpus.py --k 30).
# ~12.8k Boltz predictions (mutants + WT). At ~0.8 it/s over 3 GPUs this is ~1.5-2 h.
# Use this to get results on the table by tomorrow; scale to _wide if time allows.
#
# Same 412-protein coverage as _wide, just shallower per protein: protein /
# cluster / de-novo holdouts are unaffected (they need proteins, not depth);
# the per-substitution holdouts get thinner tails (362/380 substitutions here).

head:
  mode: "train"
  experiment_name: "tsuboyama_bench_fast"

data_processing:
  overwrite: false
  raw_data_path: "data/raw/tsuboyama_bench_fast.csv"
  dataset_type: "dms"
  msa_strategy: "mutate_wt_msa"
  msa_mutation_strategy: "mutate_first_row"
  max_msa_sequences: 1000

feature_extraction:
  process_one_by_one: false
  boltz_flags:
    accelerator: "gpu"
    model: "boltz2"
    recycling_steps: 3
    write_full_pae: false
    write_full_pde: false
    write_embeddings: true
    skip_run_structure: true

slim:
  keep_s: true
  delete_raw: true

feature:
  source: "auto"

training:
  target: "ddg"
  test_size: 0.2
  random_state: 42
